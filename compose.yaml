services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "${WATCHPACK_POLLING:-true}"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_cache:/app/.next

volumes:
  node_modules:
  next_cache:
